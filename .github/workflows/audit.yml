name: Security Audit

on:
  push:
    paths:
      - 'Cargo.lock'
      - '.cargo/audit.toml'
      - 'docs/security/**'
  pull_request:
    paths:
      - 'Cargo.lock'
      - '.cargo/audit.toml'
      - 'docs/security/**'
  schedule:
    - cron: '0 0 * * 0' # run every sunday

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
