<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <title>Registrar Obra - ARKHE</title>
</head>

<body class="body-principal">

    <div class="container-menu">

        <aside class="container-menu-lateral">

            <div class="itens-menu-lateral">
                <span id="span-icone">A</span>
                <span id="span-arkhe">ARKHE</span>
            </div>

            <nav class="nav-lateral">

                <a href="registrar.html" class="item-nav-ml ativo">
                    <span data-icone="registrar">Registrar Obra</span>
                </a>

                <a href="verificar.html" class="item-nav-ml">
                    <span data-icone="verificar">Verificar</span>
                </a>

                <a href="royalties.html" class="item-nav-ml">
                    <span data-icone="royalties">Royalties</span>
                </a>

            </nav>

                <label class="modo-escuro-menu" for="switch">
                    <span>Modo escuro</span>
                    <input type="checkbox" id="switch">
                    <span class="switch"></span>
                </label>

        </aside>

        <main class="main-menu-principal">

            <header class="hader-menu-principal">

                <h1>Registrar Obra</h1>

                <p>
                    Crie um registro de autoria da Solana
                </p>

            </header>

            <div class="menu-grid">
            
                <div class="coluna-arquivo">

                    <span class="titulo-arquivo-span">ARQUIVO DA OBRA</span> <br>

                <section class="card-documento">

                    <div class="card-arquivo">

                        <input type="file" id="arquivo" hidden>

                        <label for="arquivo" class="area-upload">
                            <div class="icone-arquivo">📄</div>
                            <strong id="nome-arquivo">Clique para escolher um arquivo</strong>
                            <span id="info-arquivo">ou arraste e solte aqui</span>
                        </label>
                    </div>

                </section>

                <section class="card-impressao">

                    <span class="texto-card-impressao">Impressão Digital</span>

                </section>

                <section class="card-hash">

                    <span class="texto-card-hash">O hash será registrado exclusivamente na Solana.</span>

                </section>
            </div> <!--Tive que criar uma div só para a coluna esquerda e uma para a coluna direita-->

                <div class="coluna-formulario">

                    <form class="card-formulario">

                        <span class="titulo-arquivo-span">DADOS DO REGISTRO</span>
                        
                        <div class="linha-campos">
                            <div class="campo">
                                <label class="label-formulario" for="titulo">Título</label>
                                <input class="input-formulario" id="titulo" type="text" placeholder="Titulo da obra"> <!--For sempre para o ID-->
                            </div>
                            <div class="campo">
                                <label class="label-formulario" for="autor">Autor</label>
                                <input class="input-formulario" id="autor" type="text" placeholder="Nome do autor">
                            </div>
                        </div>

                        <div class="linha-campos">
                            <div class="campo">
                                <label class="label-formulario" for="preco">Preço da licença</label>
                                <input class="input-formulario" id="preco" type="number" min="1" placeholder="0,00">
                            </div>
                        </div>
                    </form>
                    <hr>
                    <div class="benef-topo">
                        <div>
                            <h2 class="titulo-beneficios">BENEFICIÁRIOS</h2>
                            <p class="benef-descricao">Defina a divisão automática dos royalties</p>
                        </div>
                        <button type="button" id="btn-adicionar" class="botao-texto">+ Adicionar</button>
                    </div>

                    <div id="lista-beneficiarios"> <!--Aqui é para a lsita quando adicionar o beneficiário. Usar o JS para lista-->

                    </div>

                    <div id="benef-resumo-soma" class="soma-benef">

                    </div>

                    <!--Molde da lista-->
                    <template id="modelo-beneficiario">
                        
                        <div class="benef-linha">
                            
                            <input class="input-formulario benef-nome" type="text" placeholder="Nome do Estúdio">
                            
                            <div class="benef-percentual">
                                
                                <input class="input-formulario" type="number" min="0" max="100" value="0">
                                
                                <span>%</span>
                            
                            </div>
                            
                            <button type="button" class="btn-remover" aria-label="Remover beneficiário">✕</button>

                        </div>

                    </template>
                </div>
            </div>
        </main>

    </div>

    <script src="script.js"></script>

</body>
</html>
